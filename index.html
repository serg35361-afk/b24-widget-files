<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фото ковров до стирки</title>
  <!-- Подключаем BX24 SDK -->
  <script src="//api.bitrix24.com/api/v1/"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background: #f7f9fc;
      color: #333;
    }
    .widget-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #2067b0;
    }
    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: white;
      border: 1px solid #e5e9ef;
      border-radius: 8px;
      transition: border-color 0.2s;
    }
    .file-item:hover { border-color: #2067b0; }
    .file-icon { font-size: 24px; }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size { font-size: 12px; color: #8a94a6; margin-top: 2px; }
    .download-btn {
      padding: 6px 12px;
      background: #2067b0;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .download-btn:hover { background: #1a5591; }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #8a94a6;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #8a94a6;
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">Загрузка...</div>
  </div>

  <script>
    // === КОНФИГУРАЦИЯ ===
    // Название для заголовка виджета (необязательно, можно оставить как есть)
    const SMART_TYPE_TITLE = 'Фото ковров до стирки';
    // UF-код поля с файлами в Смарт-процессе
    const FILE_FIELD_CODE = 'UF_CRM_11_1788517182224';

    // === УТИЛИТЫ ===
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function getFileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      const icons = {
        pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊',
        jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️',
        zip: '📦', rar: '📦', '7z': '📦',
        mp4: '🎬', mp3: '🎵', txt: '📃'
      };
      return icons[ext] || '📎';
    }

    function showError(message) {
      document.getElementById('app').innerHTML =
        '<div class="error">⚠️ ' + message + '</div>';
    }

    // === ОСНОВНАЯ ЛОГИКА ===
    BX24.init(function() {
      // Шаг 1: Получаем ID текущей Сделки
      BX24.placement.options(function(opts) {
        const dealId = opts.ID;
        if (!dealId) return showError('Не удалось определить ID Сделки');

        // Шаг 2: Получаем массив ID привязанных Смарт-процессов
        BX24.callMethod('crm.deal.get', { id: dealId }, function(dealResult) {
          if (!dealResult.data()) return showError('Сделка не найдена');

          const deal = dealResult.data();
          // ✅ Поле множественное — получаем массив ID
          const smartIds = deal['UF_CRM_1751384703'] || [];

          if (!smartIds.length) {
            document.getElementById('app').innerHTML =
              '<div class="empty-state">📂 К этой Сделке не привязаны процессы</div>';
            return;
          }

          // Шаг 3: Для каждого Смарт-процесса получаем файлы
          const allFiles = [];
          let smartProcessesLoaded = 0;

          smartIds.forEach(function(smartId) {
            BX24.callMethod('crm.item.get', {
              id: smartId,
              entityTypeId: 'DYNAMIC_1042' // ✅ ID типа вашего Смарт-процесса
            }, function(itemResult) {
              if (itemResult.data()) {
                const item = itemResult.data();
                const fileIds = item[FILE_FIELD_CODE] || [];

                // Получаем информацию о каждом файле
                let filesLoaded = 0;
                
                if (fileIds.length === 0) {
                  smartProcessesLoaded++;
                  if (smartProcessesLoaded === smartIds.length) {
                    renderFiles(allFiles);
                  }
                  return;
                }

                fileIds.forEach(function(fileId) {
                  BX24.callMethod('disk.file.get', { id: fileId }, function(fileResult) {
                    if (fileResult.data()) {
                      allFiles.push(fileResult.data());
                    }
                    filesLoaded++;

                    if (filesLoaded === fileIds.length) {
                      smartProcessesLoaded++;
                      if (smartProcessesLoaded === smartIds.length) {
                        renderFiles(allFiles);
                      }
                    }
                  });
                });
              } else {
                smartProcessesLoaded++;
                if (smartProcessesLoaded === smartIds.length) {
                  renderFiles(allFiles);
                }
              }
            });
          });
        });
      });
    });

    // === РЕНДЕРИНГ ===
    function renderFiles(files) {
      if (files.length === 0) {
        document.getElementById('app').innerHTML =
          '<div class="empty-state">📂 В привязанных процессах нет фото</div>';
        return;
      }

      let html = '<div class="widget-title">📸 Фото ковров до стирки (' + files.length + ')</div>';
      html += '<div class="file-list">';

      files.forEach(function(file) {
        html += '<div class="file-item">' +
          '<div class="file-icon">' + getFileIcon(file.NAME) + '</div>' +
          '<div class="file-info">' +
            '<div class="file-name">' + file.NAME + '</div>' +
            '<div class="file-size">' + formatSize(file.SIZE) + '</div>' +
          '</div>' +
          '<a class="download-btn" href="' + file.DOWNLOAD_URL +
            '&auth=' + BX24.getAuth().access_token +
            '" target="_blank">Скачать</a>' +
        '</div>';
      });

      html += '</div>';
      document.getElementById('app').innerHTML = html;

      // Подгоняем высоту фрейма под содержимое
      BX24.placement.call('setHeight', document.body.scrollHeight + 20);
    }
  </script>
</body>
</html>
